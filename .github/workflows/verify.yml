name: AVR firmware and host regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
  avr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      # Use its pinned GNU AVR toolchain, not the Arduino runtime/framework.
      - run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
      - run: |
          toolchain_dir="$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin"
          make CC="$toolchain_dir/avr-gcc" OBJCOPY="$toolchain_dir/avr-objcopy" SIZE="$toolchain_dir/avr-size"
